<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CX Genie Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-light">
    <div
      id="login-container"
      class="container d-flex justify-content-center align-items-center min-vh-100"
    >
      <div class="card p-4 shadow" style="width: 100%; max-width: 400px">
        <h2 class="text-center mb-4">CX Login</h2>
        <form id="login-form">
          <div class="mb-3">
            <input
              type="text"
              id="cx-id"
              class="form-control"
              placeholder="CX ID"
              required
            />
          </div>
          <div class="mb-3">
            <input
              type="password"
              id="password"
              class="form-control"
              placeholder="Password"
              required
            />
          </div>
          <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <p id="login-error" class="text-danger text-center mt-3"></p>
      </div>
    </div>

    <div id="dashboard-container" class="container-fluid hidden">
      <nav class="navbar navbar-expand-lg navbar-light bg-white shadow mb-4">
        <div class="container-fluid">
          <h1 class="navbar-brand mb-0">CX Dashboard</h1>
          <button id="logout-btn" class="btn btn-outline-danger">Logout</button>
        </div>
      </nav>

      <div class="row">
        <!-- Vertical Sidebar -->
        <div class="col-md-2 bg-light vh-100 p-3">
          <h5 class="mb-3">Navigation</h5>
          <div
            class="nav flex-column nav-pills"
            id="v-pills-tab"
            role="tablist"
            aria-orientation="vertical"
          >
            <button
              class="nav-link active"
              id="v-pills-bookings-tab"
              data-bs-toggle="pill"
              data-bs-target="#v-pills-bookings"
              type="button"
              role="tab"
              aria-controls="v-pills-bookings"
              aria-selected="true"
            >
              Bookings
            </button>
            <button
              class="nav-link"
              id="v-pills-chat-tab"
              data-bs-toggle="pill"
              data-bs-target="#v-pills-chat"
              type="button"
              role="tab"
              aria-controls="v-pills-chat"
              aria-selected="false"
            >
              Chat Requests
            </button>
            <button
              class="nav-link"
              id="v-pills-agents-tab"
              data-bs-toggle="pill"
              data-bs-target="#v-pills-agents"
              type="button"
              role="tab"
              aria-controls="v-pills-agents"
              aria-selected="false"
            >
              Agents
            </button>
          </div>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 p-4">
          <div class="tab-content" id="v-pills-tabContent">
            <div
              class="tab-pane fade show active"
              id="v-pills-bookings"
              role="tabpanel"
              aria-labelledby="v-pills-bookings-tab"
            >
              <h4>Bookings</h4>
              <div class="row mb-3">
                <div class="col-md-3">
                  <select id="service-filter" class="form-select">
                    <option value="">All Services</option>
                    <!-- Options will be populated by JS -->
                  </select>
                </div>
                <div class="col-md-3">
                  <select id="status-filter" class="form-select">
                    <option value="">All Statuses</option>
                    <option value="Pending">Pending</option>
                    <option value="Accepted">Accepted</option>
                    <option value="Finished">Finished</option>
                    <option value="Cancelled">Cancelled</option>
                  </select>
                </div>
                <div class="col-md-3">
                  <select id="agent-filter" class="form-select">
                    <option value="">All Agents</option>
                    <!-- Options will be populated by JS -->
                  </select>
                </div>
                <div class="col-md-3">
                  <div class="row">
                    <div class="col-6">
                      <input
                        type="date"
                        id="date-from"
                        class="form-control"
                        placeholder="From Date"
                      />
                    </div>
                    <div class="col-6">
                      <input
                        type="date"
                        id="date-to"
                        class="form-control"
                        placeholder="To Date"
                      />
                    </div>
                  </div>
                </div>
              </div>
              <div id="bookings-grid" class="row g-4">
                <!-- Tiles will be populated by JS -->
              </div>
            </div>
            <div
              class="tab-pane fade"
              id="v-pills-chat"
              role="tabpanel"
              aria-labelledby="v-pills-chat-tab"
            >
              <h4>Chat Requests</h4>
              <div id="chat-requests-list" class="list-group">
                <!-- Chat requests will be populated by JS -->
              </div>
            </div>
            <div
              class="tab-pane fade"
              id="v-pills-agents"
              role="tabpanel"
              aria-labelledby="v-pills-agents-tab"
            >
              <h4>Agents</h4>
              <div class="mb-3">
                <div class="dropdown">
                  <button
                    class="btn btn-outline-secondary dropdown-toggle"
                    type="button"
                    id="service-filter-dropdown"
                    data-bs-toggle="dropdown"
                    aria-expanded="false"
                  >
                    Filter by Services
                  </button>
                  <ul class="dropdown-menu" id="service-checkboxes">
                    <!-- Checkboxes will be populated by JS -->
                  </ul>
                </div>
              </div>
              <div id="agents-list" class="row g-4">
                <!-- Agents will be populated by JS -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
