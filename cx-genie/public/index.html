<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CX Genie Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-light">
    <div
      id="login-container"
      class="container d-flex justify-content-center align-items-center min-vh-100"
    >
      <div class="card p-4 shadow" style="width: 100%; max-width: 400px">
        <h2 class="text-center mb-4">CX Login</h2>
        <form id="login-form">
          <div class="mb-3">
            <input
              type="text"
              id="cx-id"
              class="form-control"
              placeholder="CX ID"
              required
            />
          </div>
          <div class="mb-3">
            <input
              type="password"
              id="password"
              class="form-control"
              placeholder="Password"
              required
            />
          </div>
          <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <p id="login-error" class="text-danger text-center mt-3"></p>
      </div>
    </div>

    <div id="dashboard-container" class="container-fluid hidden">
      <nav class="navbar navbar-expand-lg navbar-light bg-white shadow mb-4">
        <div class="container-fluid">
          <h1 class="navbar-brand mb-0">CX Dashboard</h1>
          <button id="logout-btn" class="btn btn-outline-danger">Logout</button>
        </div>
      </nav>

      <div class="row">
        <!-- Vertical Sidebar -->
        <div class="col-md-2 bg-light vh-100 p-3">
          <h5 class="mb-3">Navigation</h5>
          <div
            class="nav flex-column nav-pills"
            id="v-pills-tab"
            role="tablist"
            aria-orientation="vertical"
          >
            <button
              class="nav-link active"
              id="v-pills-bookings-tab"
              data-bs-toggle="pill"
              data-bs-target="#v-pills-bookings"
              type="button"
              role="tab"
              aria-controls="v-pills-bookings"
              aria-selected="true"
            >
              Bookings
            </button>
            <button
              class="nav-link"
              id="v-pills-chat-tab"
              data-bs-toggle="pill"
              data-bs-target="#v-pills-chat"
              type="button"
              role="tab"
              aria-controls="v-pills-chat"
              aria-selected="false"
            >
              Chats
            </button>
            <button
              class="nav-link"
              id="v-pills-agents-tab"
              data-bs-toggle="pill"
              data-bs-target="#v-pills-agents"
              type="button"
              role="tab"
              aria-controls="v-pills-agents"
              aria-selected="false"
            >
              Agents
            </button>
            <button
              class="nav-link"
              id="v-pills-slots-tab"
              data-bs-toggle="pill"
              data-bs-target="#v-pills-slots"
              type="button"
              role="tab"
              aria-controls="v-pills-slots"
              aria-selected="false"
            >
              Slots
            </button>
          </div>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 p-4">
          <div class="tab-content" id="v-pills-tabContent">
            <div
              class="tab-pane fade show active"
              id="v-pills-bookings"
              role="tabpanel"
              aria-labelledby="v-pills-bookings-tab"
            >
              <h4>Bookings</h4>
              <div class="row mb-3">
                <div class="col-md-4">
                  <select id="service-filter" class="form-select">
                    <option value="">All Services</option>
                    <!-- Options will be populated by JS -->
                  </select>
                </div>
                <div class="col-md-4">
                  <select id="status-filter" class="form-select">
                    <option value="">All Statuses</option>
                    <option value="Pending">Pending</option>
                    <option value="Accepted">Accepted</option>
                    <option value="Finished">Finished</option>
                    <option value="Cancelled">Cancelled</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <button
                    class="btn btn-success"
                    type="button"
                    id="advanced-filters-toggle"
                  >
                    Advanced Filters <i class="bi bi-chevron-down"></i>
                  </button>
                </div>
              </div>
              <div
                id="advanced-filters"
                class="border rounded p-3 bg-light"
                style="display: none"
              >
                <div class="row mb-3">
                  <div class="col-md-6">
                    <label class="form-label">Quick Date Filters</label>
                    <select id="quick-date-filter" class="form-select">
                      <option value="">Select Quick Filter</option>
                      <option value="today">Today</option>
                      <option value="yesterday">Yesterday</option>
                      <option value="this-week">This Week</option>
                      <option value="last-7-days">Last 7 Days</option>
                      <option value="this-month">This Month</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Custom Date Range</label>
                    <input
                      type="text"
                      id="date-range-picker"
                      class="form-control"
                      placeholder="Select date range"
                    />
                  </div>
                </div>
                <div class="row mb-3">
                  <div class="col-md-12">
                    <label class="form-label">Agent Filter</label>
                    <select id="agent-filter" class="form-select">
                      <option value="">All Agents</option>
                      <!-- Options will be populated by JS -->
                    </select>
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-12 text-end">
                    <button
                      id="clear-filters-btn"
                      class="btn btn-outline-secondary"
                    >
                      Clear All Filters
                    </button>
                  </div>
                </div>
              </div>
              <div
                id="bookings-grid"
                class="row g-4"
                <!--
                Tiles
                will
                be
                populated
                by
                JS
                --
              ></div>
            </div>

            <div
              class="tab-pane fade"
              id="v-pills-slots"
              role="tabpanel"
              aria-labelledby="v-pills-slots-tab"
            >
              <h4>Slots</h4>
              <div class="mb-3">
                <label for="slot-date" class="form-label">Select Date</label>
                <input type="date" id="slot-date" class="form-control" />
              </div>
              <div class="mb-3">
                <label class="form-label"
                  >Available Time Slots (9AM - 5PM)</label
                >
                <div id="time-slots-grid" class="d-flex flex-wrap gap-2">
                  <!-- Time slot buttons will be populated by JS -->
                </div>
                <button id="save-slots-btn" class="btn btn-primary mt-3">
                  Save Selected Slots
                </button>
              </div>
              <div id="slots-list" class="mt-4">
                <h5>Current Available Slots</h5>
                <div id="current-slots" class="row g-3">
                  <!-- Slots will be populated by JS -->
                </div>
              </div>
            </div>
            <div
              class="tab-pane fade"
              id="v-pills-agents"
              role="tabpanel"
              aria-labelledby="v-pills-agents-tab"
            >
              <h4>Agents</h4>
              <div class="mb-3">
                <div class="dropdown">
                  <button
                    class="btn btn-outline-secondary dropdown-toggle"
                    type="button"
                    id="service-filter-dropdown"
                    data-bs-toggle="dropdown"
                    aria-expanded="false"
                  >
                    Filter by Services
                  </button>
                  <ul class="dropdown-menu" id="service-checkboxes">
                    <!-- Checkboxes will be populated by JS -->
                  </ul>
                </div>
              </div>
              <div id="agents-list" class="row g-4">
                <!-- Agents will be populated by JS -->
              </div>
            </div>
            <div
              class="tab-pane fade"
              id="v-pills-chat"
              role="tabpanel"
              aria-labelledby="v-pills-chat-tab"
            >
              <h4>Chats</h4>
              <div class="mb-3">
                <button class="btn btn-outline-primary" id="filter-all">
                  All
                </button>
                <button
                  class="btn btn-outline-primary active"
                  id="filter-active"
                >
                  Active
                </button>
                <button class="btn btn-outline-primary" id="filter-closed">
                  Closed
                </button>
              </div>
              <h5>Incoming Chat Requests</h5>
              <div id="chat-requests-list" class="list-group mb-3">
                <!-- Chat requests will be populated by JS -->
              </div>
              <div id="chats-general" class="row g-3">
                <!-- Chat tiles will be populated by JS -->
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Persistent Open Chats Container -->
      <div
        id="open-chats-container"
        class="position-fixed bottom-0 end-0 m-3"
        style="width: 40vw; height: 60vh; display: none; z-index: 1050"
      >
        <div class="card h-100">
          <div class="card-body p-0" id="chats-body">
            <ul
              class="nav nav-tabs card-header-tabs"
              id="chat-tabs"
              role="tablist"
            >
              <!-- Tabs will be added dynamically -->
            </ul>
            <div class="tab-content p-2" id="chat-tabs-content">
              <!-- Tab content will be added dynamically -->
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
